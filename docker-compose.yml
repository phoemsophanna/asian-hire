
services:
  asian-hire:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.asianhire.com.kh/api
        NEXT_PUBLIC_SITE_URL: https://asianhire.com.kh

    container_name: asian-hire

    restart: unless-stopped

    ports:
      - "4200:4200"

    environment:
      NODE_ENV: production
      PORT: 4200
      HOSTNAME: 0.0.0.0
