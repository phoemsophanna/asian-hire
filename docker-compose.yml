services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.asianhire.com.kh/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://new.asianhire.com.kh}
    image: asianhire-app:latest
    container_name: asianhire-app
    ports:
      - "4200:4200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "https://new.asianhire.com.kh/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
